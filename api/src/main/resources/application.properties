quarkus.application.name=console-api
quarkus.http.port=8080

# --- Datasource ------------------------------------------------------------
# dev = throwaway container; staging/prod = Supabase via DB_URL/DB_USER/DB_PASSWORD.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=2

# Supavisor transaction mode has no server-side prepared statements.
%staging.quarkus.datasource.jdbc.url=${DB_URL}
%staging.quarkus.datasource.username=${DB_USER}
%staging.quarkus.datasource.password=${DB_PASSWORD}
%staging.quarkus.datasource.jdbc.additional-jdbc-properties.prepareThreshold=0
%staging.quarkus.datasource.jdbc.additional-jdbc-properties.preparedStatementCacheQueries=0
%staging.quarkus.hibernate-orm.log.sql=true

%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.prepareThreshold=0
%prod.quarkus.datasource.jdbc.additional-jdbc-properties.preparedStatementCacheQueries=0

# One Lambda handles one request at a time, so a big pool is wasted connections.
%prod.quarkus.datasource.jdbc.max-size=2
%prod.quarkus.datasource.jdbc.min-size=0

# --- Hibernate -------------------------------------------------------------
# Flyway owns the schema; Hibernate never touches it.
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
%dev.quarkus.hibernate-orm.log.sql=true

# --- Flyway ----------------------------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
# Never auto-baseline: V001 is the baseline and must actually run.
quarkus.flyway.baseline-on-migrate=false

# dev & test start from a clean schema.
%dev.quarkus.flyway.clean-at-start=true
%dev.quarkus.flyway.clean-disabled=false
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false

# staging & prod: never clean, real data.
%staging.quarkus.flyway.clean-at-start=false
%staging.quarkus.flyway.clean-disabled=true
%prod.quarkus.flyway.clean-at-start=false
%prod.quarkus.flyway.clean-disabled=true

# Flyway's lock needs a pinned session, which the pooler does not give it, and
# Lambda cold starts would race. Migrate by hand against port 5432 (session
# mode) instead: quarkus:dev -Dquarkus.profile=staging, then switch back to 6543.
%prod.quarkus.flyway.migrate-at-start=false

# --- OpenAPI / Swagger UI --------------------------------------------------
quarkus.smallrye-openapi.info-title=Magic Touch Console API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Backend for the Magic Touch Console printing ERP.
quarkus.swagger-ui.path=/q/swagger-ui
# Build-time flag: false keeps the UI in dev/test only and out of function.zip.
quarkus.swagger-ui.always-include=false

# --- Logging ---------------------------------------------------------------
quarkus.log.console.json=false
%prod.quarkus.log.console.json=true

# --- CORS ------------------------------------------------------------------
# Default allows any localhost port; set CORS_ORIGINS to the exact deployed origin.
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:/https?://localhost:[0-9]+/}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type

# --- Authentication --------------------------------------------------------
# Supabase signs user tokens ES256; verify against its public JWKS. No secret.
# The token's `sub` is the app_users id. Its `role` claim is always
# "authenticated" - real roles live in the database.
mp.jwt.verify.publickey.location=${SUPABASE_JWKS_URL:https://example.supabase.co/auth/v1/.well-known/jwks.json}
mp.jwt.verify.publickey.algorithm=ES256
mp.jwt.verify.issuer=${SUPABASE_ISSUER:https://example.supabase.co/auth/v1}
mp.jwt.verify.audiences=authenticated

# Tests and dev mode sign with a local EC key - see TestTokens.
%test.mp.jwt.verify.publickey.location=test-jwt-public-key.pem
%test.mp.jwt.verify.issuer=https://test.supabase.co/auth/v1
%dev.mp.jwt.verify.publickey.location=test-jwt-public-key.pem
%dev.mp.jwt.verify.issuer=https://test.supabase.co/auth/v1

# Staging talks to real Supabase, so keep the token failure reason visible.
%staging.quarkus.log.category."io.smallrye.jwt".level=DEBUG
%staging.quarkus.log.category."io.quarkus.smallrye.jwt".level=DEBUG

# --- Authorization ---------------------------------------------------------
# By path, so a new resource cannot ship ungated. Health stays open for the probe.
#
# OPTIONS is excluded on purpose. A CORS preflight carries no Authorization
# header, so an authenticated policy answers it with a 401 - and a 401 has no
# Access-Control-Allow-Origin, so the browser blocks the real request that
# follows. Preflight itself moves no data, and the actual GET/POST is still
# authenticated.
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.api.methods=GET,HEAD,POST,PUT,PATCH,DELETE
quarkus.http.auth.permission.public.paths=/q/health,/q/health/*
quarkus.http.auth.permission.public.policy=permit

# --- Supabase Auth Admin API -----------------------------------------------
# Creates and deletes logins when an admin adds or removes a user.
# The service-role key bypasses RLS: server-side only, never in the browser.
# Unset means user creation returns 503; everything else still works.
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
