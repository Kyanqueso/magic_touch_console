<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="theme-color" content="#8122E0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Magic Touch Console</title>
    <!-- Shown until the app bundle downloads and React mounts. -->
    <style>
      #boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 100vh;
        background: #eeedfe;
        font-family: Lato, system-ui, sans-serif;
      }
      #boot span {
        width: 28px;
        height: 28px;
        border: 3px solid #cecbf6;
        border-top-color: #8122e0;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      #boot p {
        margin: 0;
        font-size: 14px;
        color: #5b6470;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <span></span>
        <p>Loading Magic Touch Console...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
